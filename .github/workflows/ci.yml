name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Abhaengigkeiten installieren
        run: pip install -r backend/requirements.txt

      - name: Tests
        env:
          # SQLite statt Postgres - die Tests brauchen keinen Server.
          DATABASE_URL: sqlite:///./ci-test.db
          JWT_SECRET: ci-secret-mit-mindestens-32-zeichen-laenge
          # Damit "import app..." aufgeht, ohne das Paket zu installieren.
          PYTHONPATH: backend
        run: pytest -q backend/tests

  frontend:
    name: Frontend (tsc + Tests + Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhaengigkeiten installieren
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Tests
        run: npm test
        working-directory: frontend

      - name: Typpruefung und Build
        run: npm run build
        working-directory: frontend

  docker:
    name: Images bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backend-Image
        run: docker build -t orgaboard-backend:ci ./backend

      - name: Frontend-Image
        run: docker build -t orgaboard-frontend:ci ./frontend
