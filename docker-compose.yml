services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orgaboard
      POSTGRES_USER: orgaboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt - ./start.sh anlegen lassen oder .env.example kopieren}
    volumes:
      - orgaboard_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orgaboard -d orgaboard"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ENV: ${ENV:-development}
      DATABASE_URL: postgresql+psycopg://orgaboard:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}@db:5432/orgaboard
      # Kein Standardwert: ein im Repository nachlesbares Secret erlaubt jedem,
      # der es kennt, beliebige Sitzungen zu faelschen. ./start.sh erzeugt beim
      # ersten Start eine .env mit einem zufaelligen Wert.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET fehlt - ./start.sh anlegen lassen oder .env.example kopieren}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      PASSWORD_RESET_ALLOWED_ORIGINS: ${PASSWORD_RESET_ALLOWED_ORIGINS:-}
      AUTO_CREATE_SCHEMA: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-1600}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-45}
      AI_ENABLED: "true"
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:?SEED_DEFAULT_PASSWORD fehlt - ./start.sh anlegen lassen oder .env.example kopieren}
      SEED_USERS_FILE: ${SEED_USERS_FILE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      PASSWORD_RESET_EXP_MINUTES: ${PASSWORD_RESET_EXP_MINUTES:-20}
      CHAT_MEDIA_DIR: /data/chat-media
    volumes:
      - orgaboard_chat_media:/data/chat-media
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  orgaboard_db:
  orgaboard_chat_media:
